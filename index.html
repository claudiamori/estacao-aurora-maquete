<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estação Aurora · Maquete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noite:#0B1530; --painel:#172B57; --painel2:#1E3568;
  --turquesa:#2DD4BF; --violeta:#A78BFA; --ambar:#FBBF24; --rosa:#FB7185; --azul:#60A5FA; --texto:#EAF2FB;
  --suave:#B9C8E0; --linha:rgba(234,242,251,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--noite);color:var(--texto);font-family:'Open Sans',system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:'Montserrat',system-ui,sans-serif;margin:0;line-height:1.2}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turquesa);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr 380px;height:100vh;height:100dvh}
#view{position:relative;overflow:hidden;min-height:0}
#gl{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#gl.hover{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:auto;border:0;border-radius:999px;padding:6px 12px 6px 10px;min-height:32px;
  background:rgba(11,21,48,.86);color:var(--texto);font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;letter-spacing:.01em;
  display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35);border:1px solid var(--linha);visibility:hidden}
.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c,var(--turquesa));flex:none}
.tag:hover,.tag.on{background:var(--painel2);border-color:var(--c,var(--turquesa))}
.tag.sub{font-size:12px;min-height:28px;padding:4px 10px 4px 8px}
.topbar{position:absolute;left:16px;top:14px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.brand{pointer-events:auto;background:rgba(11,21,48,.78);border:1px solid var(--linha);border-radius:14px;padding:10px 14px}
.brand small{display:block;color:var(--turquesa);font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.brand h1{font-size:20px;font-weight:800}
.tools{display:flex;gap:8px;pointer-events:auto}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid var(--linha);background:rgba(23,43,87,.92);
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--turquesa)}
.btn svg{width:18px;height:18px}
.hint{position:absolute;left:16px;bottom:14px;background:rgba(11,21,48,.78);border:1px solid var(--linha);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--suave);pointer-events:none}
.panel{background:var(--painel);border-left:1px solid var(--linha);overflow-y:auto;padding:20px 20px 28px;min-height:0}
.eyebrow{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--turquesa))}
.panel h2{font-size:24px;font-weight:800;margin:4px 0 10px}
.panel h3{font-size:15px;font-weight:700;margin:18px 0 8px;color:var(--texto)}
.panel p{margin:0 0 10px}
.lead{color:var(--suave)}
.places{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.place{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:10px 12px;min-height:52px;border-radius:12px;border:1px solid var(--linha);background:var(--painel2);cursor:pointer}
.place:hover{border-color:var(--c)}
.place .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.place b{display:block;font-family:'Montserrat',sans-serif;font-size:15px}
.place small{display:block;color:var(--suave);font-size:13px;line-height:1.35}
.sublist{list-style:none;margin:6px 0 0 24px;padding:0;display:grid;gap:6px}
.sublist .place{min-height:44px;padding:8px 10px}
.back{min-height:44px;border:0;background:none;color:var(--turquesa);font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;cursor:pointer;padding:0;margin-bottom:6px}
.back:hover{text-decoration:underline}
.people{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.person{display:flex;gap:10px;align-items:center;background:var(--painel2);border-radius:12px;padding:8px 12px;border:1px solid var(--linha)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px;background:var(--c);color:var(--noite);flex:none}
.person b{display:block;font-size:15px}
.person span{color:var(--suave);font-size:13px}
.does{margin:0;padding-left:20px}
.does li{margin-bottom:6px}
.note{border-left:3px solid var(--c,var(--turquesa));background:rgba(11,21,48,.45);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px;color:var(--suave);margin-top:14px}
.note b{color:var(--texto)}
.partof{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--linha);background:var(--painel2);border-radius:12px;padding:0 12px;cursor:pointer;font-weight:600;margin-top:6px}
.partof:hover{border-color:var(--turquesa)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* versão em texto */
#textview{position:fixed;inset:0;background:var(--noite);overflow-y:auto;z-index:20;padding:24px 16px 48px}
#textview[hidden]{display:none}
#textview .wrap{max-width:820px;margin:0 auto}
#textview h1{font-size:26px;margin-bottom:6px}
#textview h2{font-size:21px;margin:28px 0 6px;padding-top:16px;border-top:1px solid var(--linha)}
#textview h3{font-size:15px;margin:12px 0 4px;color:var(--turquesa)}
#textview .close{position:sticky;top:0;float:right}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto}
  #view{height:58vh}
  .panel{border-left:0;border-top:1px solid var(--linha);overflow:visible}
  .brand h1{font-size:17px}
  .btn .lbl{display:none}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <main id="view">
    <canvas id="gl" role="img" aria-label="Maquete 3D da Estação Aurora numa noite de inverno. A lista de lugares no painel ao lado dá o mesmo conteúdo em texto."></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div class="topbar">
      <div class="brand"><small>Missão Colheita</small><h1>Estação Aurora</h1></div>
      <div class="tools">
        <button class="btn" type="button" id="homeBtn" aria-label="Voltar à visão geral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span class="lbl">Visão geral</span></button>
        <button class="btn" type="button" id="textBtn" aria-label="Abrir versão em texto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Texto</span></button>
        <button class="btn" type="button" id="fsBtn" aria-label="Tela cheia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <div class="hint">Arraste para girar · role para aproximar · clique num lugar</div>
  </main>
  <aside class="panel" id="panel" aria-live="polite" aria-label="Lugares da estação"></aside>
</div>
<div id="textview" hidden role="dialog" aria-modal="true" aria-labelledby="tvTitle"><div class="wrap" id="tvBody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ================= CONTEÚDO ================= */
const C={turquesa:'#2DD4BF',violeta:'#A78BFA',ambar:'#FBBF24',rosa:'#FB7185',azul:'#60A5FA'};
const PEOPLE={
  nair:{n:'Nair Duarte',r:'Comandante',i:'ND'},
  livia:{n:'Lívia Sato',r:'Médica',i:'LS'},
  iara:{n:'Iara Monteiro',r:'Glaciologista',i:'IM'},
  caetano:{n:'Caetano Ribeiro',r:'Técnico de energia',i:'CR'},
  tomas:{n:'Tomás Andrade',r:'Mecânico',i:'TA'},
  iris:{n:'ÍRIS',r:'IA de bordo',i:'Í'},
  todos:{n:'Toda a tripulação',r:'Refeições, descanso e convívio',i:'5'}
};
const P={
  comando:{nome:'Comando',onde:'Módulo vermelho · andar de cima',cor:C.rosa,
    resumo:'Onde a estação é coordenada.',
    oque:['A sala de onde a estação é coordenada. Uma janela larga dá para a noite polar. Nas telas azuis, o painel geral mostra o que ÍRIS informa sobre cada setor: energia, temperatura, Estufa e laboratórios.'],
    quem:['nair'],
    faz:['Acompanhar o painel geral da estação.','Decidir as prioridades e as tarefas do dia.','Conversar com o continente nas janelas de transmissão, usando o equipamento do módulo de Comunicações.']},
  alojamento:{nome:'Alojamento',onde:'Módulo vermelho · andar de baixo',cor:C.rosa,
    resumo:'A casa da tripulação no inverno.',
    oque:['A casa da tripulação durante o inverno: quartos individuais, refeitório com mesa longa de madeira, sala de convívio, enfermaria e a despensa do dia.','A despensa do dia guarda a comida dos próximos dias. O estoque grande, que dura o inverno inteiro, fica na despensa fria do bloco técnico.'],
    quem:['todos','livia'],
    faz:['Refeições, descanso e convívio da tripulação.','Lívia atende na enfermaria e controla o estoque de comida que alimenta a tripulação até o fim do inverno.']},
  estufa:{nome:'Estufa Aurora',onde:'Três câmaras sobre pernas',cor:C.turquesa,
    resumo:'O experimento científico da estação.',
    oque:['O experimento científico da estação: testar como produzir alimentos frescos onde nada cresce, pensando em futuras bases na Lua e em Marte.','As plantas crescem sem terra, sob luz de LED, com as raízes borrifadas com água e nutrientes. A Estufa tem quatro espaços em fila, separados por paredes e portas vedadas. Cada câmara tem aquecimento, luz, rega e sensores próprios.'],
    quem:['nair','iris'],
    faz:['Nair planta, colhe e acompanha o experimento.','À noite, ÍRIS controla sozinha o aquecimento, a luz e a rega.','Os sensores das 12 bancadas medem temperatura, umidade e luz.'],
    nota:'<b>De onde vem a ideia.</b> A Estufa se inspira na EDEN ISS, estufa experimental do Centro Aeroespacial Alemão (DLR) instalada perto da estação Neumayer III, na Antártida.',
    partes:['antecamara','reserva','camara1','camara2']},
  antecamara:{nome:'Antecâmara e serviço',onde:'Estufa Aurora · entrada',cor:C.turquesa,pai:'estufa',
    resumo:'A entrada e a sala de máquinas da Estufa.',
    oque:['A entrada da Estufa e a sala de máquinas dela. Tem a porta para a ponte coberta, um armário de roupa limpa, os tanques de nutrientes, o quadro de energia da Estufa e uma mesa com terminal.','A escada externa é só saída de emergência: ninguém entra na Estufa vindo da neve.'],
    quem:['nair'],
    faz:['Trocar de roupa antes de entrar nas câmaras, para não levar sujeira às plantas.','Preparar a solução de água e nutrientes.','Consultar os dados da Estufa no terminal.']},
  reserva:{nome:'Câmara de reserva',onde:'Estufa Aurora · viveiro',cor:C.turquesa,pai:'estufa',
    resumo:'O viveiro de mudas.',
    oque:['O viveiro de mudas: a câmara menor e mais interna, colada à seção de serviço. É onde as sementes germinam e as plantas novas crescem antes de ir para as câmaras de cultivo.'],
    quem:['nair'],
    faz:['Germinar sementes.','Cuidar das mudas até o transplante.']},
  camara1:{nome:'Câmara 1',onde:'Estufa Aurora · cultivo',cor:C.turquesa,pai:'estufa',
    resumo:'Cultivo de alfaces, tomates e ervas.',
    oque:['Câmara de cultivo com alfaces, tomates e ervas, em quatro bancadas: duas de cada lado do corredor central. Cada bancada tem sensores de temperatura, umidade e luz.'],
    quem:['nair','iris'],
    faz:['Cultivo e colheita.','ÍRIS liga e desliga aquecimento, luz e rega conforme a rotina noturna.']},
  camara2:{nome:'Câmara 2',onde:'Estufa Aurora · cultivo',cor:C.turquesa,pai:'estufa',
    resumo:'Igual à Câmara 1, na ponta.',
    oque:['Igual à Câmara 1, na ponta da Estufa: quatro bancadas de cultivo, cada uma com seus sensores.'],
    quem:['nair','iris'],
    faz:['Cultivo e colheita.','ÍRIS liga e desliga aquecimento, luz e rega conforme a rotina noturna.']},
  iris:{nome:'Núcleo de ÍRIS',onde:'Módulo cinza de janelas ciano',cor:C.violeta,
    resumo:'Os servidores da IA de bordo.',
    oque:['Onde fica ÍRIS, a IA de bordo, criada em 2031 pelo Consórcio Polar. São racks de servidores que leem os sensores da estação e controlam energia, aquecimento, rega e alarmes.','Aqui ficam guardados o diário de ÍRIS (o registro automático de tudo o que ela decide), o registro de acessos (quem entrou no sistema, quando e de qual terminal), os cadernos digitais dos laboratórios e os arquivos de configuração do sistema.'],
    quem:['iris'],
    faz:['ÍRIS trabalha sem parar. À noite, enquanto a tripulação dorme, ela cuida da estação sozinha.','A tripulação só entra para manutenção.'],
    nota:'<b>Para entender.</b> ÍRIS é um sistema de automação com IA: lê dados e segue regras e instruções. Não é igual aos assistentes de conversa que vocês usam na disciplina.'},
  labs:{nome:'Laboratórios 1 e 2',onde:'Módulo azul e branco',cor:C.azul,
    resumo:'Pesquisa de clima e de gelo.',
    oque:['Um módulo com dois laboratórios. O Lab 1 tem instrumentos que medem a atmosfera e o clima. O Lab 2 é uma sala fria com testemunhos de gelo, microscópios e o caderno digital do laboratório.','Os testemunhos de gelo são cilindros retirados das camadas profundas do gelo; eles guardam registros de como era o clima no passado. Os equipamentos do Lab 2 precisam de energia o tempo todo.','Ao lado do módulo fica a sonda de teste, usada para testar o equipamento de perfuração.'],
    quem:['iara'],
    faz:['Iara estuda os testemunhos de gelo no Lab 2 e registra o trabalho no caderno digital.','Em alguns turnos, Iara vai ao campo de perfuração, longe da estação, retirar gelo antigo.']},
  tecnico:{nome:'Bloco técnico',onde:'Central de Energia · garagem · despensa fria',cor:C.ambar,
    resumo:'Energia, garagem e despensa fria.',
    oque:['O único prédio apoiado direto no chão, porque guarda o que é pesado demais para módulos sobre pernas: os geradores, os tanques de combustível e o controlador de energia, um programa antigo escrito em C que divide a energia entre os setores por ordem de prioridade. Ao lado ficam duas turbinas eólicas.','No térreo ficam a garagem-oficina, com portão largo, e a despensa fria, com o estoque de comida do inverno.'],
    quem:['caetano','tomas'],
    faz:['Caetano mantém os geradores, as turbinas e o controlador de energia.','Tomás cuida dos veículos de esteira, das motos de neve, dos trenós e da sonda de perfuração.','É a porta para o gelo: quem vai aos veículos ou ao campo de perfuração sai por aqui.']},
  comms:{nome:'Comunicações',onde:'Na ponta da passarela longa',cor:C.azul,
    resumo:'A ligação com o continente.',
    oque:['Liga a estação ao continente. A parabólica fala com satélites; a torre de luzes vermelhas sustenta as antenas de rádio.','Por aqui passam duas comunicações diferentes: o canal de dados, sempre ligado, por onde ÍRIS troca informações com o continente; e a janela de transmissão, a cada 14 dias, quando as pessoas conversam. No inverno, a conversa é espaçada para economizar energia.'],
    quem:[],
    faz:['O equipamento funciona sozinho.','A tripulação vem só para manutenção.'],
    nota:'<b>Escolha da história.</b> Estações reais têm ligação por satélite todos os dias. A janela de 14 dias é uma decisão desta ficção.'}
};
const ORDER=['comando','alojamento','estufa','iris','labs','tecnico','comms'];
const FORA=[
  {nome:'Campo de perfuração',txt:'Longe da estação, não aparece na maquete. É onde Iara retira gelo antigo, em alguns turnos, com a sonda e um abrigo. Chega-se por veículo de esteira.'},
  {nome:'Continente',txt:'A sede do Consórcio Polar, onde trabalha Otávio Reis, o engenheiro que criou ÍRIS e acompanha a estação a distância. Também fica lá a central de suporte remoto: vocês.'}
];

/* ================= CENA ================= */
const canvas=document.getElementById('gl'), view=document.getElementById('view');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x101c40,0.0032);
const camera=new THREE.PerspectiveCamera(38,1,0.5,900);
const HOME={pos:new THREE.Vector3(-54,60,98),target:new THREE.Vector3(12,4,-6)};
camera.position.copy(HOME.pos);
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.copy(HOME.target);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.maxPolarAngle=Math.PI*.47; controls.minDistance=10; controls.maxDistance=230;

/* céu na paleta da história */
const sky=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(0x060c1f)},mid:{value:new THREE.Color(0x0b1530)},hor:{value:new THREE.Color(0x172b57)}},
  vertexShader:"varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
  fragmentShader:"uniform vec3 top;uniform vec3 mid;uniform vec3 hor;varying vec3 vP;void main(){float h=clamp(vP.y,0.0,1.0);vec3 c=mix(hor,mid,smoothstep(0.0,0.2,h));c=mix(c,top,smoothstep(0.2,0.8,h));gl_FragColor=vec4(c,1.0);}"});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(600,32,16),sky));
(function(){const n=1500,p=new Float32Array(n*3);for(let i=0;i<n;i++){const th=Math.random()*Math.PI*2,ph=Math.acos(Math.random()*.92),r=560;p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=r*Math.cos(ph)+10;p[i*3+2]=r*Math.sin(ph)*Math.sin(th);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xeaf2fb,size:1.4,sizeAttenuation:false,fog:false,transparent:true,opacity:.8})));})();
const auroraMats=[];
function aurora(x,y,z,ry,w,h,seed,c1,c2){
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    uniforms:{t:{value:0},seed:{value:seed},c1:{value:new THREE.Color(c1)},c2:{value:new THREE.Color(c2)}},
    vertexShader:"uniform float t;uniform float seed;varying vec2 vUv;void main(){vUv=uv;vec3 p=position;p.z+=sin(p.x*0.02+t*0.15+seed)*18.0+sin(p.x*0.05-t*0.22+seed*2.0)*7.0;p.y+=sin(p.x*0.03+t*0.1)*4.0;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}",
    fragmentShader:"uniform float t;uniform float seed;uniform vec3 c1;uniform vec3 c2;varying vec2 vUv;void main(){float b=smoothstep(0.0,0.12,vUv.y)*pow(1.0-vUv.y,1.6);float r=0.55+0.45*sin(vUv.x*90.0+t*0.6+seed*5.0)*sin(vUv.x*23.0-t*0.3);float e=smoothstep(0.0,0.15,vUv.x)*smoothstep(1.0,0.85,vUv.x);vec3 c=mix(c1,c2,smoothstep(0.25,0.9,vUv.y));gl_FragColor=vec4(c,b*r*e*0.55);}"});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h,160,1),m);mesh.position.set(x,y,z);mesh.rotation.y=ry;scene.add(mesh);auroraMats.push(m);}
aurora(60,90,-240,.1,520,110,0,0x2dd4bf,0xa78bfa);
aurora(200,115,-300,-.35,460,130,2.1,0x2dd4bf,0xa78bfa);
aurora(-120,72,-190,.5,300,80,4.2,0x2dd4bf,0x60a5fa);

scene.add(new THREE.HemisphereLight(0x5a72b4,0x141f3d,.5));
const moon=new THREE.DirectionalLight(0xc8d8ff,.65);moon.position.set(-50,80,50);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);

const FOOT={comando:[0,0,10,8],alojamento:[0,0,10,8],estufa:[28.5,EZ,15,6],antecamara:[16,EZ,3.5,4],reserva:[20.8,EZ,4,5],camara1:[28.1,EZ,6,5.5],camara2:[37.1,EZ,6,5.5],
  iris:[26,-5,5.5,4],labs:[6,-36,13,5],tecnico:[-38,-2,11,10],comms:[63,-15,8,6]};

/* ================= INTERAÇÃO ================= */
const labelsEl=document.getElementById('labels'), tags={};
function mkTag(id,sub){const b=document.createElement('button');b.type='button';b.tabIndex=-1;b.className='tag'+(sub?' sub':'');b.textContent=P[id].nome;b.style.setProperty('--c',P[id].cor);
  b.addEventListener('click',()=>select(id,true));labelsEl.appendChild(b);tags[id]=b;}
ORDER.forEach(id=>mkTag(id,false));P.estufa.partes.forEach(id=>mkTag(id,true));
let selected=null;
const tmpV=new THREE.Vector3();
function placeLabels(){
  const w=view.clientWidth,h=view.clientHeight;const showSub=selected&&(selected==='estufa'||P[selected].pai==='estufa');
  const list=showSub?ORDER.filter(id=>id!=='estufa').concat(P.estufa.partes):ORDER.slice();
  Object.keys(tags).forEach(id=>{if(!list.includes(id))tags[id].style.visibility='hidden';});
  const placed=[];
  list.map(id=>{tmpV.copy(anchors[id]).project(camera);return{id,x:tmpV.x,y:tmpV.y,z:tmpV.z};}).sort((a,b)=>a.z-b.z).forEach(o=>{
    const el=tags[o.id],ew=el.offsetWidth,eh=el.offsetHeight;let x=(o.x*.5+.5)*w-ew/2,y=(-o.y*.5+.5)*h-eh/2;
    if(o.z>1||x<-ew*.5||x>w-ew*.5||y<62||y>h-eh){el.style.visibility='hidden';return;}
    x=Math.max(6,Math.min(w-6-ew,x));
    for(let k=0;k<4;k++){const hit=placed.find(p=>x<p.x+p.w+4&&x+ew+4>p.x&&y<p.y+p.h+3&&y+eh+3>p.y);if(!hit)break;y=hit.y-eh-4;}
    placed.push({x,y,w:ew,h:eh});el.style.visibility='visible';el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';});
}
function setGlow(id,on,strength){(placeMeshes[id]||[]).forEach(m=>{const mt=m.material;if(!mt||!mt.isMeshStandardMaterial)return;
  if(mt.userData.e0===undefined){mt.userData.e0=mt.emissive.getHex();mt.userData.i0=mt.emissiveIntensity;}
  if(on){mt.emissive.setHex(0x2dd4bf);mt.emissiveIntensity=strength;}else{mt.emissive.setHex(mt.userData.e0);mt.emissiveIntensity=mt.userData.i0;}});}
let hoverId=null;
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function pick(ev){const r=canvas.getBoundingClientRect();mouse.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables,false)[0];return hit?hit.object.userData.place:null;}
canvas.addEventListener('pointermove',ev=>{const id=pick(ev);if(id===hoverId)return;
  if(hoverId&&hoverId!==selected)setGlow(hoverId,false);hoverId=id;if(id&&id!==selected)setGlow(id,true,.08);canvas.classList.toggle('hover',!!id);});
let down=null;canvas.addEventListener('pointerdown',ev=>{down=[ev.clientX,ev.clientY];});
canvas.addEventListener('pointerup',ev=>{if(!down)return;const d=Math.hypot(ev.clientX-down[0],ev.clientY-down[1]);down=null;if(d>5)return;
  const id=pick(ev);if(!id)return;const inEstufa=selected&&(selected==='estufa'||P[selected].pai==='estufa');select(P[id].pai&&!inEstufa?'estufa':id,true);});

/* câmera */
let fly=null;
function flyTo(pos,target){if(reduce){camera.position.copy(pos);controls.target.copy(target);return;}fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:target,s:performance.now()};}
function focus(id){const f=FOOT[id];const t=new THREE.Vector3(f[0],FLOOR+2,f[1]);const dist=Math.max(32,Math.max(f[2],f[3])*4.3);
  const dir=new THREE.Vector3(-.42,.55,.72).normalize();flyTo(t.clone().add(dir.multiplyScalar(dist)),t);}

/* ================= PAINEL ================= */
const panel=document.getElementById('panel');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function placeBtn(id){const p=P[id];return '<li><button class="place" type="button" data-id="'+id+'" style="--c:'+p.cor+'"><span class="dot" aria-hidden="true"></span><span><b>'+esc(p.nome)+'</b><small>'+esc(p.resumo)+'</small></span></button>'+
  (p.partes?'<ul class="sublist">'+p.partes.map(placeBtn).join('')+'</ul>':'')+'</li>';}
function renderOverview(){
  panel.style.removeProperty('--c');
  panel.innerHTML='<div class="eyebrow">A estação por dentro</div><h2>Quem faz o quê, em cada lugar</h2>'+
  '<p class="lead">A maquete mostra a estação numa noite comum de inverno, antes do incidente. Escolha um lugar para saber o que ele é, quem trabalha ali e o que se faz lá.</p>'+
  '<ul class="places">'+ORDER.map(placeBtn).join('')+'</ul>'+
  '<h3>Como se circula</h3><p class="lead">Todos os módulos são ligados por pontes cobertas: ninguém precisa sair no gelo para ir de um lugar a outro. As escadas externas são saídas de emergência. Quem vai ao gelo sai pelo bloco técnico, que fica no nível da neve.</p>'+
  '<h3>Fora da maquete</h3>'+FORA.map(f=>'<p><b>'+esc(f.nome)+'.</b> <span class="lead">'+esc(f.txt)+'</span></p>').join('');
  bind();
}
function renderPlace(id){
  const p=P[id];panel.style.setProperty('--c',p.cor);
  const people=p.quem.length?'<ul class="people">'+p.quem.map(k=>{const q=PEOPLE[k];return '<li class="person"><span class="avatar" aria-hidden="true">'+esc(q.i)+'</span><span><b>'+esc(q.n)+'</b><span>'+esc(q.r)+'</span></span></li>';}).join('')+'</ul>':'<p class="lead">Ninguém trabalha aqui o tempo todo.</p>';
  panel.innerHTML='<button class="back" type="button" data-back>← Todos os lugares</button>'+
   '<div class="eyebrow">'+esc(p.onde)+'</div><h2>'+esc(p.nome)+'</h2>'+
   '<h3>O que é</h3>'+p.oque.map(t=>'<p>'+esc(t)+'</p>').join('')+
   '<h3>Quem trabalha aqui</h3>'+people+
   '<h3>O que se faz aqui</h3><ul class="does">'+p.faz.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>'+
   (p.partes?'<h3>As partes da Estufa</h3><div class="chips">'+p.partes.map(k=>'<button class="partof" type="button" data-id="'+k+'">'+esc(P[k].nome)+'</button>').join('')+'</div>':'')+
   (p.pai?'<button class="partof" type="button" data-id="'+p.pai+'">Faz parte da '+esc(P[p.pai].nome)+' →</button>':'')+
   (p.nota?'<p class="note">'+p.nota+'</p>':'');
  bind();panel.scrollTop=0;
}
function bind(){panel.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id,true)));
  const bk=panel.querySelector('[data-back]');if(bk)bk.addEventListener('click',home);}
function select(id,move){
  if(selected)setGlow(selected,false);if(hoverId)setGlow(hoverId,false);
  Object.values(tags).forEach(t=>t.classList.remove('on'));
  selected=id;setGlow(id,true,.13);if(tags[id])tags[id].classList.add('on');
  const f=FOOT[id];ring.position.x=f[0];ring.position.z=f[1];ring.scale.set(f[2],f[3],1);ring.material.opacity=.85;
  renderPlace(id);if(move)focus(id);
  const b=panel.querySelector('.back');if(b)b.focus({preventScroll:true});
}
function home(){if(selected)setGlow(selected,false);Object.values(tags).forEach(t=>t.classList.remove('on'));selected=null;ring.material.opacity=0;renderOverview();flyTo(HOME.pos.clone(),HOME.target.clone());}
document.getElementById('homeBtn').addEventListener('click',home);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!tv.hidden)closeText();else if(selected)home();}});

/* versão em texto */
const tv=document.getElementById('textview'),tvBody=document.getElementById('tvBody');let lastFocus=null;
function textOf(id,level){const p=P[id];const q=p.quem.length?p.quem.map(k=>PEOPLE[k].n+' ('+PEOPLE[k].r.toLowerCase()+')').join('; '):'Ninguém trabalha aqui o tempo todo.';
  return '<h2 id="t-'+id+'">'+esc(p.nome)+'</h2><p class="lead">'+esc(p.onde)+'</p><h3>O que é</h3>'+p.oque.map(t=>'<p>'+esc(t)+'</p>').join('')+
  '<h3>Quem trabalha aqui</h3><p>'+esc(q)+'</p><h3>O que se faz aqui</h3><ul>'+p.faz.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>'+(p.nota?'<p class="note">'+p.nota+'</p>':'');}
function openText(){lastFocus=document.activeElement;
  const all=[];ORDER.forEach(id=>{all.push(id);if(P[id].partes)all.push(...P[id].partes);});
  tvBody.innerHTML='<button class="btn close" type="button" id="tvClose">Fechar texto</button><h1 id="tvTitle">Estação Aurora · a estação por dentro</h1>'+
   '<p class="lead">Versão em texto da maquete, com o mesmo conteúdo. A estação aparece numa noite comum de inverno, antes do incidente.</p>'+
   '<p>A planta, vista de frente: à esquerda, o bloco técnico no nível da neve, com duas turbinas eólicas atrás. No centro, o módulo vermelho de dois andares sobre pernas. À frente e à direita, a Estufa, com a antecâmara e três câmaras em fila. Atrás do módulo vermelho, o módulo azul e branco dos laboratórios, com a sonda de teste. À direita, o pequeno Núcleo de ÍRIS e, no fim de uma passarela longa, o módulo de Comunicações com a torre e a parabólica.</p>'+
   all.map(id=>textOf(id)).join('')+
   '<h2>Como se circula</h2><p>Todos os módulos são ligados por pontes cobertas: ninguém precisa sair no gelo para ir de um lugar a outro. As escadas externas são saídas de emergência. Quem vai ao gelo sai pelo bloco técnico.</p>'+
   '<h2>Fora da maquete</h2>'+FORA.map(f=>'<p><b>'+esc(f.nome)+'.</b> '+esc(f.txt)+'</p>').join('');
  tv.hidden=false;document.getElementById('tvClose').addEventListener('click',closeText);document.getElementById('tvClose').focus();}
function closeText(){tv.hidden=true;if(lastFocus)lastFocus.focus();}
document.getElementById('textBtn').addEventListener('click',openText);

/* tela cheia */
document.getElementById('fsBtn').addEventListener('click',()=>{const d=document;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}
  const el=d.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req){try{const r=req.call(el);if(r&&r.catch)r.catch(()=>window.open(location.href,'_blank'));}catch(e){window.open(location.href,'_blank');}}else window.open(location.href,'_blank');});

/* ================= LAÇO ================= */
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(fly){const u=Math.min(1,(performance.now()-fly.s)/950),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(u>=1)fly=null;}
  if(!reduce){auroraMats.forEach(m=>m.uniforms.t.value=t);rotors.forEach((r,i)=>r.rotation.z-=dt*(1.1+i*.2));
    const a=snowGeo.attributes.position.array;for(let i=0;i<SN;i++){a[i*3+1]-=dt*1.2;a[i*3]+=dt*1.6;if(a[i*3+1]<0){a[i*3+1]=34;a[i*3]=(Math.random()-.5)*170;}if(a[i*3]>85)a[i*3]-=170;}snowGeo.attributes.position.needsUpdate=true;
    const on=Math.sin(t*3)>0;towerLights.forEach(m=>m.color.setHex(on?0xff4a3a:0x5a1a14));
    if(selected)ring.material.opacity=.55+.3*Math.sin(t*3);}
  controls.update();renderer.render(scene,camera);placeLabels();requestAnimationFrame(loop);
}
resize();renderOverview();loop();
</script>
</body>
</html>
