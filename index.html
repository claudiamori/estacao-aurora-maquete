<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Maquete da Estação Aurora · Missão Colheita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: palco 3D em tela cheia à esquerda, prancheta de leitura à direita (embaixo no celular). Tema único escuro: é uma noite polar. */
:root{
  --night:#0a1020;
  --panel:#101a31;
  --panel-2:#16223f;
  --line:#2a3a62;
  --edge:#6a80b3;
  --ice:#e6eefa;
  --ice-dim:#a9b9d6;
  --glow:#ffb35e;
  --aurora:#73e6c4;
  --iris:#bb98ff;
  --alert:#ff7a6b;
  --font-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ice);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.stage{position:relative;overflow:hidden;min-width:0}
.view{position:absolute;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl:active{cursor:grabbing}

/* HUD */
.hud{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;pointer-events:none;max-width:min(360px,calc(100% - 32px))}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice-dim)}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,4.4vw,56px);line-height:.9;letter-spacing:.01em;margin:2px 0 0;text-transform:uppercase;text-shadow:0 2px 24px rgba(10,16,32,.8)}
.sub{color:var(--ice-dim);font-size:14px;margin:4px 0 0}
.readout{pointer-events:auto;background:rgba(16,26,49,.78);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--font-mono);font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.readout dt{color:var(--ice-dim);letter-spacing:.08em;text-transform:uppercase}
.readout dd{margin:0}
.ok{color:var(--aurora)}
.bad{color:var(--alert)}
.meter{display:flex;align-items:center;gap:8px}
.meter i{display:block;height:6px;width:90px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i b{display:block;height:100%;background:var(--glow);transition:width .8s}

/* Rótulos 3D */
#labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:999px;border:1px solid var(--edge);background:rgba(10,16,32,.72);backdrop-filter:blur(4px);font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer;transition:opacity .3s,background .2s,border-color .2s;will-change:transform}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ice);flex:none}
.tag[data-kind="ghost"]::before{background:transparent;border:1.5px dashed var(--alert)}
.tag[data-kind="far"]::before{background:var(--aurora)}
.tag:hover{background:rgba(22,34,63,.95);border-color:var(--ice)}
.tag.on{border-color:var(--glow);background:rgba(60,38,10,.85)}
.tag.on::before{background:var(--glow);box-shadow:0 0 10px var(--glow)}
.tag.dim{opacity:.32}
.tag.sel{border-color:var(--glow);background:var(--glow);color:#1b1206}
.tag.sel::before{background:#1b1206}

/* Linha do tempo */
.timeline{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:rgba(16,26,49,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:min(340px,calc(100% - 32px))}
.timeline h2{font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice-dim);margin:0 0 8px}
.steps{display:flex;gap:4px;margin:0;padding:0;list-style:none}
.steps li{flex:1}
.steps button{width:100%;min-height:44px;border-radius:4px;border:1px solid var(--edge);background:var(--panel-2);cursor:pointer;font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.steps button[aria-pressed="true"]{background:var(--glow);border-color:var(--glow);color:#1b1206;font-weight:500}
.steps button:hover{border-color:var(--ice-dim)}
.step-now{margin:8px 0 0;font-size:13px}
.step-now strong{display:block;font-family:var(--font-mono);font-weight:500;font-size:12px;color:var(--glow)}

/* Fases */
.phases{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;background:rgba(16,26,49,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:calc(100% - 32px);overflow-x:auto}
.phases span{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ice-dim);margin-right:4px;white-space:nowrap}
.phases #phaseBtns{display:flex;gap:6px;flex-wrap:wrap}
.phases button{min-width:44px;height:44px;border-radius:4px;border:1px solid var(--edge);background:var(--panel-2);cursor:pointer;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.04em}
.phases button[aria-pressed="true"]{background:var(--glow);border-color:var(--glow);color:#1b1206}
.phases button:hover{border-color:var(--ice-dim)}
.reset{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));height:48px;padding:0 14px;border-radius:6px;border:1px solid var(--edge);background:rgba(16,26,49,.82);cursor:pointer;font-size:13px}
.reset:hover{border-color:var(--ice-dim)}

/* Prancheta */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding-block:22px 28px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));min-width:0}
.panel h2{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em;margin:6px 0 10px;text-wrap:balance}
.panel h3{font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice-dim);margin:22px 0 8px}
.panel p{margin:0 0 10px;max-width:62ch}
.lead{font-size:16px}
.warn{border:1px dashed var(--alert);color:var(--ice);border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:16px}
.howto{margin:0;padding-left:18px;color:var(--ice-dim);font-size:14px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{width:100%;min-height:44px;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;border:1px solid var(--edge);background:var(--panel-2);cursor:pointer}
.item:hover{border-color:var(--ice-dim)}
.item small{display:block;color:var(--ice-dim);font-size:12.5px;font-weight:400}
.item b{font-weight:700}
.chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.story{color:var(--aurora)}
.chip.proposed{color:var(--glow)}
.chip.never{color:var(--alert);border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
dl.facts{margin:0;display:grid;gap:12px}
dl.facts dt{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ice-dim)}
dl.facts dd{margin:2px 0 0}
.clue{border-left:3px solid var(--glow);padding:6px 0 6px 12px;background:rgba(255,179,94,.06)}
.back{border:none;background:none;color:var(--ice-dim);cursor:pointer;min-height:44px;padding:0;font-size:14px}
.back:hover{color:var(--ice)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:1px solid var(--edge);background:var(--panel-2);border-radius:4px;min-width:44px;min-height:44px;padding:3px 9px;cursor:pointer;font-family:var(--font-display);font-weight:800;font-size:16px}
.qchips button:hover{border-color:var(--glow)}
.question{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.15;color:var(--glow);margin:0 0 12px}
.todo{margin:0;padding-left:18px;font-size:14px;color:var(--ice-dim)}
.todo li{margin-bottom:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;display:block}
  .stage{display:flex;flex-direction:column;gap:10px;overflow:visible;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view{position:relative;inset:auto;height:60vh;min-height:360px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .timeline,.phases{position:static;transform:none;width:auto;max-width:none}
  .readout{display:none}
  .reset{bottom:auto;top:max(14px,env(safe-area-inset-top,0px));height:44px}
  .panel{border-left:none;border-top:1px solid var(--line)}
  .tag{font-size:11.5px;padding:3px 8px 3px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="stage" id="stage">
    <div class="view" id="view">
    <canvas id="gl" role="img" aria-label="Maquete 3D da Estação Aurora: uma espinha de módulos azuis sobre pernas com esquis, um núcleo vermelho no meio, a cúpula da Estufa na ponta, um bloco técnico separado ligado por passarela, o módulo de Comunicações com a torre de antenas, veículos de esteira e o campo de perfuração. A mesma informação está em texto na prancheta ao lado."></canvas>
    <div id="labels"></div>

    <div class="hud">
      <div>
        <div class="eyebrow">COM220 · Maquete da história</div>

      </div>
      <dl class="readout" aria-label="Painel da estação">
        <dt>Geração</dt><dd class="meter"><i><b id="genBar" style="width:100%"></b></i><span id="genTxt">100%</span></dd>
        <dt>Estufa</dt><dd id="estufaTxt" class="ok">ligada</dd>
        <dt>Painel</dt><dd class="ok">operação conforme o esperado</dd>
      </dl>

    </div>

    <section class="timeline" aria-labelledby="tl-h">
      <h2 id="tl-h">Linha do tempo do caso</h2>
      <ol class="steps" id="steps"></ol>
      <p class="step-now" id="stepNow" aria-live="polite"></p>
    </section>

    <nav class="phases" aria-label="Quinzenas da disciplina">
      <span>Quinzenas</span>
      <div id="phaseBtns"></div>
    </nav>
    <button class="reset" id="reset" type="button">Visão geral</button>
  </div>

  <aside class="panel" id="panel" aria-label="Prancheta da maquete">

  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

/* ============ CONTEÚDO DA HISTÓRIA ============ */

const auroraMats=[];
function aurora(y,z,x,rotY,w,h,seed,col1,col2){
  const geo=new THREE.PlaneGeometry(w,h,160,1);
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    uniforms:{t:{value:0},seed:{value:seed},c1:{value:new THREE.Color(col1)},c2:{value:new THREE.Color(col2)},amp:{value:1}},
    vertexShader:"uniform float t; uniform float seed; varying vec2 vUv; void main(){ vUv=uv; vec3 p=position; p.z+=sin(p.x*0.02+t*0.15+seed)*18.0+sin(p.x*0.05-t*0.22+seed*2.0)*7.0; p.y+=sin(p.x*0.03+t*0.1)*4.0; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}",
    fragmentShader:"uniform float t; uniform float seed; uniform vec3 c1; uniform vec3 c2; uniform float amp; varying vec2 vUv; void main(){ float base=smoothstep(0.0,0.12,vUv.y)*pow(1.0-vUv.y,1.6); float rays=0.55+0.45*sin(vUv.x*90.0+t*0.6+seed*5.0)*sin(vUv.x*23.0-t*0.3); float ends=smoothstep(0.0,0.15,vUv.x)*smoothstep(1.0,0.85,vUv.x); vec3 c=mix(c1,c2,smoothstep(0.25,0.9,vUv.y)); gl_FragColor=vec4(c, base*rays*ends*0.55*amp);}"});
  const mesh=new THREE.Mesh(geo,m); mesh.position.set(x,y,z); mesh.rotation.y=rotY; scene.add(mesh); auroraMats.push(m);
}

function winMat(c){return new THREE.MeshBasicMaterial({color:c});}
function roundRect(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}
// caixa arredondada ao longo de X (ou de Z, se alongZ)
function rbox(len,d,h,r,mat,alongZ){
  const g=new THREE.ExtrudeGeometry(roundRect(d,h,r),{depth:len,bevelEnabled:false,curveSegments:6});
  g.translate(0,0,-len/2); if(!alongZ) g.rotateY(Math.PI/2);
  const m=new THREE.Mesh(g,mat); m.castShadow=m.receiveShadow=true; return m;
}

}

// módulo da espinha
function module(id,o){
  const g=new THREE.Group(); g.position.set(o.x,0,o.z||0);
  const L=o.len,D=o.d,H=o.h,mat=o.mat||M.blue,trim=o.trim||M.blueTrim;
  const body=rbox(L,D,H,.55,mat); body.position.y=FLOOR+H/2; g.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(L*.96,.25,D*.9),trim); roof.position.y=FLOOR+H+.05; g.add(roof);
  const chassis=new THREE.Mesh(new THREE.BoxGeometry(L*.94,.4,D*.8),M.steel); chassis.position.y=FLOOR-.15; g.add(chassis);
  for(const lx of [-L/2+1.6,L/2-1.6]) for(const lz of [-D/2+.9,D/2-.9]) leg(g,lx,lz,FLOOR-.3);
  // janelas em faixa (frente e fundo)
  const wm=winMat(o.win||0xffd9a3);
  const rows=o.rows||1, n=Math.max(2,Math.floor(L/2.2));
  for(let r=0;r<rows;r++) for(let i=0;i<n;i++){
    const x=-L/2+L*(i+.5)/n, y=FLOOR+(rows===1?H*.58:H*(.32+r*.42));
    for(const side of [1,-1]){const w=new THREE.Mesh(new THREE.PlaneGeometry(.75,.6),wm); w.position.set(x,y,side*(D/2+.02)); if(side<0) w.rotation.y=Math.PI; g.add(w);}
  }
  scene.add(g); tagPick(g,id);
  sectorObj[id]={group:g,winMat:wm,anchor:new THREE.Vector3(o.x,FLOOR+H+2.6,o.z||0),foot:{x:o.x,z:o.z||0,rx:L/2+2,rz:D/2+2.5},len:L,x:o.x,z:o.z||0};
  return sectorObj[id];
}

  const strip=new THREE.Mesh(new THREE.PlaneGeometry(L*.7,.35),winMat(0xbfe0ff)); strip.position.set((x1+x2)/2,y+.4,z+1.32); scene.add(strip);

}
function bridgeZ(z1,z2,x){

  for(let z=z1+3;z<z2-1;z+=5){const p=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,FLOOR+.3,8),M.steel); p.position.set(x,(FLOOR-.3)/2,z); p.castShadow=true; scene.add(p);

function stairs(x,z,h,dir){
  const g=new THREE.Group(); g.position.set(x,0,z);

  scene.add(g);
}

const estufa=(function(){
  const id='estufa', x=34.6, R=6.6;

  const deck=new THREE.Mesh(new THREE.CylinderGeometry(R+.5,R+.5,.9,48),M.blueTrim); deck.position.y=FLOOR-.15; deck.castShadow=deck.receiveShadow=true; g.add(deck);

  const glass=new THREE.Mesh(new THREE.SphereGeometry(R,48,24,0,Math.PI*2,0,Math.PI/2),glassMat); glass.position.y=FLOOR+.3; g.add(glass);
  const ico=new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(R*1.004,2),1);
  const src=ico.attributes.position.array, keep=[];
  for(let i=0;i<src.length;i+=6){ if(src[i+1]>-0.05 && src[i+4]>-0.05) keep.push(src[i],src[i+1],src[i+2],src[i+3],src[i+4],src[i+5]); }
  const fg=new THREE.BufferGeometry(); fg.setAttribute('position',new THREE.Float32BufferAttribute(keep,3));
  const frame=new THREE.LineSegments(fg,new THREE.LineBasicMaterial({color:0x26324f})); frame.position.y=FLOOR+.3; g.add(frame);
  const plantMat=new THREE.MeshStandardMaterial({color:0x7fc46a,roughness:.8});
  for(const zz of [-2.4,0,2.4]){ for(const lv of [0,1]){
    const sh=new THREE.Mesh(new THREE.BoxGeometry(6.6,.12,1.1),M.steel); sh.position.set(0,FLOOR+.7+lv*1.15,zz); g.add(sh);
    const pl=new THREE.Mesh(new THREE.BoxGeometry(6.2,.35,.8),plantMat); pl.position.set(0,FLOOR+.95+lv*1.15,zz); g.add(pl);}}
  const lamp=new THREE.PointLight(0xffa04a,2.2,30,1.6); lamp.position.set(0,FLOOR+4,0); g.add(lamp);
  const spill=new THREE.PointLight(0xff8a3a,1.6,26,2); spill.position.set(0,FLOOR+1,R+1.5); g.add(spill);
  const hc=document.createElement('canvas'); hc.width=hc.height=128; const hx=hc.getContext('2d'); const hg=hx.createRadialGradient(64,64,0,64,64,64);

  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(hc),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.8,fog:false}));
  halo.scale.set(28,28,1); halo.position.y=FLOOR+3; g.add(halo);
  scene.add(g); tagPick(g,id);
  sectorObj[id]={group:g,anchor:new THREE.Vector3(x,FLOOR+R+3,0),foot:{x,z:0,rx:R+2,rz:R+2},len:2*R,x,z:0};
  return {glassMat,plantMat,lamp,spill,halo};

function along(info,u,out){let d=u*info.tot;for(let i=0;i<info.seg.length;i++){if(d<=info.seg[i]){return out.copy(info.pts[i]).lerp(info.pts[i+1],info.seg[i]?d/info.seg[i]:0);}d-=info.seg[i];}return out.copy(info.pts[info.pts.length-1]);}

let narrow=null;
function placeLabels(){
  const w=view.clientWidth,h=view.clientHeight;
  const nw=w<600; if(nw!==narrow){narrow=nw; for(const id in tags) tags[id].textContent=nw?(SECTORS[id].curto||SECTORS[id].nome):SECTORS[id].nome;}
  const placed=[];
  const ids=Object.keys(tags).map(id=>{tmpV.copy(sectorObj[id].anchor).project(camera); return {id,x:tmpV.x,y:tmpV.y,z:tmpV.z};}).sort((a,b)=>a.z-b.z);
  for(const o of ids){const el=tags[o.id];
    const ew=el.offsetWidth, eh=el.offsetHeight;
    let x=(o.x*.5+.5)*w-ew/2, y=(-o.y*.5+.5)*h-eh/2;
    if(o.z>1||o.z<-1||x<-ew*.5||x>w-ew*.5||y<0||y>h-eh){el.style.visibility='hidden';continue;}
    x=Math.max(6,Math.min(w-6-ew,x));
    for(let k=0;k<4;k++){const hit=placed.find(p=>x<p.x+p.w+4&&x+ew+4>p.x&&y<p.y+p.h+3&&y+eh+3>p.y); if(!hit) break; y=hit.y-eh-4;}
    placed.push({x,y,w:ew,h:eh});
    el.style.visibility='visible'; el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';}
}

   '<p class="warn">Material de design da disciplina. Contém a solução do mistério; não é para os alunos.</p>'+
   '<p class="lead">Uma espinha de módulos sobre pernas hidráulicas com esquis, atravessada em relação ao vento, com um núcleo vermelho no meio. A energia vem de um bloco técnico separado; as comunicações ficam num módulo isolado. Clique num setor para ver quem está ali, o que ele guarda e qual pista esconde.</p>'+
   '<ul class="howto"><li>Arrastar gira a estação; a rodinha (ou o gesto de pinça) aproxima.</li><li>Os botões Q1 a Q8 acendem os lugares de cada quinzena.</li><li>A linha do tempo mostra, na própria maquete, das noites comuns até a manhã do dia 10.</li></ul>'+
   '<h3>Os sete setores</h3><ul class="list">'+ORDER_IN.map(itemBtn).join('')+'</ul>'+
   '<h3>Fora dos setores</h3><ul class="list">'+ORDER_OUT.map(itemBtn).join('')+'</ul>'+
   '<h3>Como os setores se ligam</h3><ul class="howto">'+
   '<li><b>Pontes cobertas</b> entre os módulos da espinha: dá para ir de um setor a outro sem sair no gelo.</li>'+
   '<li><b>Passarela coberta</b> do núcleo até a Central de Energia, com a bandeja de cabos por baixo. Os pontos laranja que correm nos cabos mostram a energia chegando a cada setor.</li>'+
   '<li><b>Cabo em postes e caminho com bandeiras</b> até o módulo de Comunicações.</li>'+
   '<li><b>Trilha de bandeiras</b> até o campo de perfuração, percorrida com veículos de esteira.</li>'+
   '<li><b>Canal de terra</b>, pela antena, até o continente.</li></ul>'+
   '<h3>De onde vem a planta</h3><p class="lead">A planta se inspira em duas estações reais: a Halley VI (Reino Unido), com módulos azuis sobre esquis e um núcleo social vermelho, e a Comandante Ferraz (Brasil), com bloco técnico e módulos isolados. A Estufa se inspira no EDEN ISS, estufa experimental da estação alemã Neumayer III.</p>';
  bindPanel();
}
function renderSector(id){
  const s=SECTORS[id];
  panelBody.innerHTML=
   '<button class="back" type="button" data-back>← Visão geral</button>'+
   '<div class="legend">'+chip(s.status)+'</div><h2>'+esc(s.nome)+'</h2>'+
   '<p class="lead">'+esc(s.resumo)+'</p>'+
   '<dl class="facts"><div><dt>Quem</dt><dd>'+esc(s.quem)+'</dd></div>'+
   '<div><dt>O que guarda</dt><dd>'+esc(s.guarda)+'</dd></div>'+
   '<div><dt>Na noite do caso</dt><dd>'+esc(s.noite)+'</dd></div>'+
   '<div class="clue"><dt>Pista</dt><dd>'+esc(s.pista)+'</dd></div></dl>'+
   '<h3>Aparece nas quinzenas</h3><div class="qchips">'+s.fases.map(q=>'<button type="button" data-phase="'+q+'" aria-label="Quinzena Q'+q+': '+esc(PHASES[q].titulo)+'">Q'+q+'</button>').join('')+'</div>';
  bindPanel();
}
function renderPhase(q){
  const p=PHASES[q];
  panelBody.innerHTML=
   '<button class="back" type="button" data-back>← Visão geral</button>'+
   '<div class="eyebrow">Quinzena Q'+q+'</div><h2>'+esc(p.titulo)+'</h2>'+
   '<p class="question">'+esc(p.pergunta)+'</p>'+
   '<dl class="facts"><div><dt>Missão</dt><dd>'+esc(p.peca)+'</dd></div>'+
   '<div class="clue"><dt>Pista</dt><dd>'+esc(p.frag)+'</dd></div></dl>'+
   '<h3>Lugares desta quinzena</h3><ul class="list">'+p.setores.map(itemBtn).join('')+'</ul>';
  bindPanel();
}
function bindPanel(){
  panelBody.querySelectorAll('[data-sector]').forEach(b=>b.addEventListener('click',()=>selectSector(b.dataset.sector,true)));
  panelBody.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>selectPhase(+b.dataset.phase)));
  const back=panelBody.querySelector('[data-back]'); if(back) back.addEventListener('click',goHome);
  document.getElementById('panel').scrollTop=0;
}

function refreshTags(){
  const lit=state.phase?new Set(PHASES[state.phase].setores):null;
  for(const id in tags){const el=tags[id];
    el.classList.toggle('sel',state.sector===id);
    el.classList.toggle('on',!!lit&&lit.has(id)&&state.sector!==id);
    el.classList.toggle('dim',!!lit&&!lit.has(id)&&state.sector!==id);}
  for(const id in sectorObj){const r=sectorObj[id].ring; if(!r) continue;
    r.userData.on = (state.sector===id) || (!!lit&&lit.has(id));}
  document.querySelectorAll('#phaseBtns button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.q===state.phase)));
}

function selectSector(id,fly){
  state.sector=id; renderSector(id); refreshTags();
  if(fly) flyTo(id);
}
function selectPhase(q){
  if(state.phase===q){state.phase=null; refreshTags(); if(!state.sector) renderOverview(); return;}
  state.phase=q; state.sector=null; renderPhase(q); refreshTags();
  flyHome();
}
function goHome(){state.sector=null; state.phase=null; renderOverview(); refreshTags(); flyHome();}

/* câmera */
let tween=null;
function flyTo(id){
  const o=sectorObj[id]; let target, pos;
  if(id==='continente'){target=new THREE.Vector3(-46,16,-28); pos=new THREE.Vector3(10,32,40);}
  else{const a=o.anchor; target=new THREE.Vector3(a.x,Math.max(3,a.y*.45),a.z); const d=id==='perfuracao'?40:Math.max(36,(o.len||10)*2+20);
    pos=new THREE.Vector3(a.x-d*.2,a.y*.5+d*.42,a.z+d*.95);}
  startTween(pos,target);
}
function flyHome(){startTween(HOME.pos.clone(),HOME.target.clone());}
function startTween(pos,target){
  if(reduceMotion){camera.position.copy(pos); controls.target.copy(target); controls.update(); return;}
  tween={t:0,dur:1.1,p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:target};
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* linha do tempo */
const stepsEl=document.getElementById('steps');
STEPS.forEach((s,i)=>{const li=document.createElement('li'); const b=document.createElement('button'); b.type='button'; b.textContent=s.curto; b.setAttribute('aria-label',s.hora); b.dataset.i=i;
  b.addEventListener('click',()=>setStep(i,true)); li.appendChild(b); stepsEl.appendChild(li);});
function setStep(i,fly){
  const s=STEPS[i]; state.step=i;
  state.stormTarget=s.storm; state.estufaTarget=s.estufaOn?1:0; state.lab2Target=s.lab2?1:0;
  beamState.on=s.beam; beamState.t=0;
  sentState.alert=s.sent;
  stepsEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===i)));
  document.getElementById('stepNow').innerHTML='<strong>'+esc(s.hora)+'</strong><span>'+esc(s.texto)+'</span>';
  document.getElementById('genBar').style.width=s.gen+'%';
  document.getElementById('genTxt').textContent=s.gen+'%';
  const et=document.getElementById('estufaTxt'); et.textContent=s.estufaOn?'ligada':'0% · sem energia'; et.className=s.estufaOn?'ok':'bad';
  if(fly && s.focus){selectSector(s.focus,true);} else if(fly && i===0){goHome();}
}
const beamState={on:false,t:0};
const sentState={alert:false};

/* fases */
const pb=document.getElementById('phaseBtns');
for(let q=1;q<=8;q++){const b=document.createElement('button'); b.type='button'; b.textContent='Q'+q; b.dataset.q=q; b.setAttribute('aria-pressed','false');
  b.setAttribute('aria-label','Quinzena Q'+q+': '+PHASES[q].titulo); b.title=PHASES[q].titulo; b.addEventListener('click',()=>selectPhase(q)); pb.appendChild(b);}
document.getElementById('reset').addEventListener('click',goHome);
document.addEventListener('keydown',e=>{if(e.key==='Escape') goHome();});

/* clique na maquete */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>5) return;
  const r=canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera); const hit=ray.intersectObjects(pickables,false)[0];
  if(hit&&hit.object.userData.sector) selectSector(hit.object.userData.sector,true);
});
canvas.addEventListener('pointermove',e=>{
  if(e.buttons) return; const r=canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera); const hit=ray.intersectObjects(pickables,false)[0];
  canvas.style.cursor=hit?'pointer':'grab';
});

/* redimensionar */
function resize(){const w=view.clientWidth,h=view.clientHeight; const was=HOME; HOME = w<600?HOME_M:HOME_D; if(was!==HOME&&!state.sector){camera.position.copy(HOME.pos); controls.target.copy(HOME.target);} renderer.setSize(w,h,false); camera.aspect=w/h;
  camera.fov = w<600?52:38; camera.updateProjectionMatrix();}
window.addEventListener('resize',resize); resize();

/* ============ LAÇO ============ */
const clock=new THREE.Clock();
const warmGlass=new THREE.Color(0xff9a40), coldGlass=new THREE.Color(0x35507e), warmEm=new THREE.Color(0xff7a20), coldEm=new THREE.Color(0x0e1a33);
const liveGreen=new THREE.Color(0x7fc46a), deadPlant=new THREE.Color(0x8c7a3c);
const labWarm=new THREE.Color(0xc9e6ff), labHot=new THREE.Color(0xffffff);
let t=0;
function tick(){
  const dt=Math.min(clock.getDelta(),.05); t+=reduceMotion?dt*.15:dt;
  const k=reduceMotion?1:Math.min(1,dt*1.6);
  state.storm+= (state.stormTarget-state.storm)*k;
  state.estufa+=(state.estufaTarget-state.estufa)*k;
  state.lab2+=(state.lab2Target-state.lab2)*k;

  auroraMats.forEach(m=>{m.uniforms.t.value=t; m.uniforms.amp.value=1-state.storm*.75;});
  scene.fog.density=FOG_CALM+(FOG_STORM-FOG_CALM)*state.storm;

  // estufa
  const e=state.estufa;
  estufa.glassMat.color.copy(coldGlass).lerp(warmGlass,e);
  estufa.glassMat.emissive.copy(coldEm).lerp(warmEm,e);
  estufa.glassMat.emissiveIntensity=.15+.6*e;
  estufa.plantMat.color.copy(deadPlant).lerp(liveGreen,e);
  estufa.lamp.intensity=2.2*e; estufa.spill.intensity=1.6*e; estufa.halo.material.opacity=.8*e;
  // lab 2 com prioridade elevada
  sectorObj.lab2.winMat.color.copy(labWarm).lerp(labHot,state.lab2);
  // ÍRIS pulsa
  const pulse=.5+.5*Math.sin(t*2.2);
  irisRingMat.color.setHSL(.73,.9,.62+.12*pulse);
  irisLight.intensity=1+.8*pulse+state.lab2*.8;
  // antena pisca
  sectorObj.comms.mastTip.material.color.setHex(Math.sin(t*3)>.6?0xff5a4a:0x5a1f1a);
  // turbinas (param na tempestade)
  rotors.forEach((r,i)=>{r.rotation.z+=dt*(1.6+i*.2)*(1-state.storm)*(reduceMotion?0:1);});
  // sentinela
  sentMats.forEach(m=>{m.opacity=sentState.alert?(.35+.6*(Math.sin(t*6)>0?1:0)):.6;});
  // canal de terra
  beamMat.opacity=(beamState.on?.85:.28)+(state.phase===6||state.phase===7?.3:0);
  if(beamState.on){beamState.t+=dt*.35; const u=beamState.t%2;
    if(u<1){packet.visible=true; packet.position.copy(farEnd).lerp(mastTop,u); packet2.visible=false;}
    else{packet.visible=false; packet2.visible=true; along(routeInfo,(u-1),packet2.position);}}
  else{packet.visible=packet2.visible=false;}
  // fluxo de energia
  const st=STEPS[state.step];
  for(const k in share){let v=st.gen/100; if(k==='lab2'&&st.lab2) v=1; if(k==='estufa'&&!st.estufaOn) v=0; share[k]+=(v-share[k])*Math.min(1,dt*3);}
  const fp=flowGeo.attributes.position.array, spd=reduceMotion?0:7;
  for(let i=0;i<flow.length;i++){const f=flow[i];
    if(f.slot/10>=share[f.id]-.001){fp[i*3+1]=-50;continue;}
    const u=(f.offset+t*spd/f.info.tot)%1; along(f.info,u,tmpF); fp[i*3]=tmpF.x; fp[i*3+1]=tmpF.y; fp[i*3+2]=tmpF.z;}
  flowGeo.attributes.position.needsUpdate=true;
  windsock.rotation.y=Math.sin(t*(1.5+state.storm*6))*(.08+.1*state.storm);
  // anéis
  for(const id in sectorObj){const r=sectorObj[id].ring; if(!r) continue; const tgt=r.userData.on?(.55+.3*Math.sin(t*3)):0; r.material.opacity+=(tgt-r.material.opacity)*Math.min(1,dt*6);}
  // neve
  const wind=(3+state.storm*22), fall=1.2+state.storm*1.5;
  if(!reduceMotion){
    const p=snowGeo.attributes.position.array;
    for(let i=0;i<SNOW;i++){const s=snowSpd[i];
      p[i*3+2]+=wind*s*dt; p[i*3+1]-=fall*s*dt; p[i*3]+=(Math.sin(t+i)*.3+wind*.25)*s*dt;
      if(p[i*3+2]>70) p[i*3+2]=-70; if(p[i*3]>90) p[i*3]=-90; if(p[i*3+1]<0) p[i*3+1]=34;}
    snowGeo.attributes.position.needsUpdate=true;}
  snowMat.opacity=.45+.45*state.storm; snowMat.size=.32+.12*state.storm;

  if(tween){tween.t+=dt/tween.dur; const u=ease(Math.min(1,tween.t));
    camera.position.lerpVectors(tween.p0,tween.p1,u); controls.target.lerpVectors(tween.t0,tween.t1,u);
    if(tween.t>=1) tween=null;}
  controls.update();
  renderer.render(scene,camera);
  placeLabels();
  requestAnimationFrame(tick);
}
canvas.addEventListener('pointerdown',()=>{tween=null;});
canvas.addEventListener('wheel',()=>{tween=null;},{passive:true});

renderOverview(); setStep(0,false); refreshTags();
requestAnimationFrame(tick);
window.__aurora={selectSector,selectPhase,setStep,goHome};
})();
</script>
</body></html>
